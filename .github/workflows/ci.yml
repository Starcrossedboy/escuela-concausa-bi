name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Calidad de codigo y vault
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # GitLeaks necesita historial completo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Vault lint
        run: python _Meta/scripts/vault_lint.py .
      - name: Validar tablero PM
        run: python _Meta/scripts/validate_pm_dashboard.py .
      - name: Ruff
        run: ruff check . --output-format=github || true
      - name: Pytest
        run: |
          if [ -d tests ] && [ -n "$(find tests -name 'test_*.py' 2>/dev/null)" ]; then
            pytest tests/ -q
          else
            echo "Sin pruebas aun"
          fi
      - name: Sin secretos versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|\.key$|credentials.*\.json$'; then
            echo "Archivos sensibles detectados"; exit 1
          fi
          echo "OK"
      - name: Sin archivos pesados
        run: |
          BIG=$(git ls-files | xargs -I{} du -k "{}" 2>/dev/null | awk '$1>5120 {print $2}')
          if [ -n "$BIG" ]; then echo "Archivos >5MB:"; echo "$BIG"; exit 1; fi
          echo "OK"
      - name: G5 Secret scan con GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: G6 Dependency audit con pip-audit
        run: |
          echo "🔍 Escaneando dependencias contra CVE database..."
          pip-audit --desc on --format json > audit-report.json || true
          if [ -f audit-report.json ]; then
            VULNS=$(cat audit-report.json | grep -o '"id":' | wc -l || echo 0)
            if [ "$VULNS" -gt 0 ]; then
              echo "⚠️ Se encontraron $VULNS vulnerabilidades"
              cat audit-report.json
              echo "⚠️ Revisar vulnerabilidades antes de merge"
            else
              echo "✅ Sin vulnerabilidades detectadas"
            fi
          fi
