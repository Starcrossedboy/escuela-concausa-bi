name: PM Dashboard

# Revisión obligatoria: Célula 5 (Cloud & DevOps).
# Genera un artefacto descargable; no hace commit ni push directo a main.
#
# Este check es REQUERIDO por el ruleset de `main`. Por eso el disparador de
# pull_request NO lleva filtro de `paths`: debe correr en TODOS los PR para que
# el estado siempre se reporte; si estuviera filtrado por rutas, cualquier PR
# que no tocara esas rutas dejaría el check en "pending" y bloquearía el merge.
# El job regenera desde fuentes canónicas (intactas en cualquier rama), así que
# pasa aunque el PR no toque el tablero.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'vault/00_Start_Here/Developer_Onboarding.md'
      - 'vault/02_Requirements/**'
      - 'vault/10_Risk_Governance/**'
      - 'vault/12_Roadmap_Sprints/**'
      - 'vault/13_Reports/**'
      - 'vault/14_Data_Sources/**'
      - 'vault/_Meta/scripts/*pm_dashboard.py'
      - 'vault/_Meta/scripts/collect_github_activity.py'
  schedule:
    - cron: '15 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: pm-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dashboard:
    name: Generar y validar tablero PM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recopilar actividad agregada de GitHub
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 vault/_Meta/scripts/collect_github_activity.py

      - name: Generar tablero desde fuentes canónicas
        run: python3 vault/_Meta/scripts/generate_pm_dashboard.py .

      - name: Validar contrato del tablero
        run: python3 vault/_Meta/scripts/validate_pm_dashboard.py .

      - name: Validar salud del vault
        run: python3 vault/_Meta/scripts/vault_lint.py .

      - name: Publicar tablero auditable
        uses: actions/upload-artifact@v4
        with:
          name: faro-pm-dashboard-${{ github.run_number }}
          path: |
            vault/13_Reports/TABLERO_CONTROL_PM.html
            vault/13_Reports/data/pm-dashboard.json
            vault/13_Reports/data/pm-dashboard-history.json
            vault/13_Reports/data/github-activity.json
          if-no-files-found: error
          retention-days: 30
