name: Refresh PM Dashboard

# Mantiene el Tablero de Control PM "vivo": en cada push a main que toque una
# fuente canónica, regenera el tablero + historial + actividad y los commitea
# de vuelta. Así nadie tiene que correr el generador a mano (DEC-004).
#
# Prevención de loop: el disparador NO incluye 13_Reports/** (lo único que
# commitea el bot), y el commit lleva [skip ci]. El push directo a main lo
# permite el bypass del ruleset (ver DEC-004): requiere el secreto
# DASHBOARD_PAT (PAT fine-grained de un admin con contents:write). Sin ese
# secreto el push no aterriza pero el job NO falla (continue-on-error).

on:
  push:
    branches: [main]
    paths:
      - '00_Start_Here/Developer_Onboarding.md'
      - '02_Requirements/**'
      - '05_Engineering/Definition_of_Done.md'
      - '10_Risk_Governance/**'
      - '12_Roadmap_Sprints/**'
      - '14_Data_Sources/**'
      - '_DevLog/**'
      - '_Meta/scripts/*pm_dashboard.py'
      - '_Meta/scripts/collect_github_activity.py'
      - '.github/workflows/refresh-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Evita ciclo con el propio commit del bot.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT de admin (en bypass del ruleset) si existe; si no, token por defecto.
          token: ${{ secrets.DASHBOARD_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Recopilar actividad de GitHub (commits y PR por autor)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 _Meta/scripts/collect_github_activity.py

      - name: Regenerar tablero desde fuentes canónicas
        run: python3 _Meta/scripts/generate_pm_dashboard.py .

      - name: Validar contrato del tablero (TEST-002)
        run: python3 _Meta/scripts/validate_pm_dashboard.py .

      - name: Commitear tablero regenerado
        # No bloquea el run si el push es rechazado (p. ej. bypass aún sin configurar).
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 13_Reports/TABLERO_CONTROL_PM.html 13_Reports/data/
          if git diff --cached --quiet; then
            echo "Tablero sin cambios; nada que commitear."
          else
            git commit -m "chore(pm): refresco automático del tablero [skip ci]"
            git push
          fi
