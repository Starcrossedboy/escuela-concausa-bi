name: Update Project Graph

# Corre en cada merge a main que toque codigo/arquitectura, o manualmente.
# NO commitea a main: la branch protection exige PR + revision de code owner
# (DEC-003), asi que un push directo del bot siempre se rechaza (GH013). En su
# lugar regenera el grafo, valida que no filtre secretos y lo publica como
# artefacto descargable de Actions. El grafo versionado en graphify-out/ se
# actualiza a mano por PR cuando se necesite.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dbt/**'
      - 'dags/**'
      - '03_Architecture/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-graph
  cancel-in-progress: true

jobs:
  update-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Graphify
        # IMPORTANTE: el paquete es graphifyy con DOBLE y.
        # 'graphify' con una sola y es un paquete NO relacionado.
        run: |
          python -m pip install --upgrade pip
          pip install graphifyy

      - name: Generar grafo del proyecto
        # --code-only: usa solo AST local (tree-sitter), sin API key ni tokens.
        # Los documentos del vault no se grafan a proposito.
        run: |
          graphify . --code-only
          graphify cluster-only .

      - name: Validar salida
        run: |
          test -f graphify-out/graph.json
          test -f graphify-out/GRAPH_REPORT.md
          echo "Grafo generado correctamente"

      - name: Verificar que no se filtren secretos
        run: |
          if grep -rEi '(api[_-]?key|secret|password|token)["'\'']?\s*[:=]\s*["'\''][^"'\'']{8,}' graphify-out/ 2>/dev/null; then
            echo "Posible secreto en la salida del grafo"; exit 1
          fi
          echo "OK"

      - name: Publicar grafo como artefacto descargable
        # Sustituye al viejo `git push` a main (rechazado por la branch protection).
        # Para actualizar el grafo versionado en el repo: regeneralo en local
        # (`graphify . --code-only && graphify cluster-only .`) y subelo por PR.
        uses: actions/upload-artifact@v4
        with:
          name: project-graph
          path: |
            graphify-out/graph.json
            graphify-out/graph.html
            graphify-out/GRAPH_REPORT.md
            graphify-out/manifest.json
          retention-days: 30
          if-no-files-found: error
