version: 2

models:
  - name: cubo_pivot
    description: >
      US-113 / DB-08. Base pivotable materializada a grano
      CCT × driver × ciclo. Expone los seis drivers en formato largo,
      atributos para filtros globales y banderas explícitas de cobertura
      de driver, predicción y recomendación.
    columns:
      - name: cct
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_escuela')
                field: cct
      - name: id_driver
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_driver')
                field: id_driver
          - accepted_values:
              arguments:
                values: ['D1', 'D2', 'D3', 'D4', 'D5', 'D6']
                quote: true
      - name: id_ciclo
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tiempo')
                field: id_ciclo
      - name: nivel
        data_tests: [not_null]
      - name: cve_ent
        data_tests: [not_null]
      - name: cve_mun
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: cve_mun
      - name: cobertura_driver
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'SIN_DATO']
      - name: cobertura_prediccion
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'SIN_DATO']
      - name: cobertura_recomendacion
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['OK', 'SIN_DATO']
