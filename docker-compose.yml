version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: escuela_concausa_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_local
      POSTGRES_DB: escuela_concausa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escuela_concausa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: escuela_concausa_api
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres_password_local@db:5432/escuela_concausa_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
