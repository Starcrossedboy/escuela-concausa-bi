# ═══════════════════════════════════════════════════════════════════════
# FARO — Docker Compose Completo
# ═══════════════════════════════════════════════════════════════════════
# Servicios:
#   - db              → PostgreSQL 15 (4 bases de datos)
#   - api             → FastAPI (backend)
#   - airflow-init    → Inicialización de Airflow (corre 1 vez)
#   - airflow-webserver → UI de Airflow (puerto 8080)
#   - airflow-scheduler → Orquestador de DAGs
#
# Creado: 2026-08-15 por Luis Téllez Domínguez (Célula 5)
# Historia: US-502
# ═══════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────
# RED INTERNA
# ───────────────────────────────────────────────────────────────────────
networks:
  faro-network:
    driver: bridge
    name: faro-network

# ───────────────────────────────────────────────────────────────────────
# VOLÚMENES PERSISTENTES
# ───────────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: faro-postgres-data
  airflow-logs:
    name: faro-airflow-logs
  airflow-plugins:
    name: faro-airflow-plugins

# ───────────────────────────────────────────────────────────────────────
# SERVICIOS
# ───────────────────────────────────────────────────────────────────────
services:

  # ═════════════════════════════════════════════════════════════════════
  # POSTGRES 15 (4 bases de datos)
  # ═════════════════════════════════════════════════════════════════════
  db:
    image: postgres:15-alpine
    container_name: faro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - faro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════
  # FASTAPI (Backend)
  # ═════════════════════════════════════════════════════════════════════
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: faro-api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT}
      PORT: ${API_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${API_PORT}:${API_PORT}"
    volumes:
      - ./src:/app/src:ro
      - ./data:/app/data:ro
    networks:
      - faro-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ═════════════════════════════════════════════════════════════════════
  # AIRFLOW INIT (Setup inicial, corre 1 sola vez)
  # ═════════════════════════════════════════════════════════════════════
  airflow-init:
    image: apache/airflow:2.7.0-python3.11
    container_name: faro-airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD}
      _AIRFLOW_WWW_USER_FIRSTNAME: FARO
      _AIRFLOW_WWW_USER_LASTNAME: Admin
      _AIRFLOW_WWW_USER_EMAIL: admin@faro.local
      _AIRFLOW_WWW_USER_ROLE: Admin
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    networks:
      - faro-network
    depends_on:
      db:
        condition: service_healthy
    user: "${AIRFLOW_UID:-50000}:0"
    command: version

  # ═════════════════════════════════════════════════════════════════════
  # AIRFLOW WEBSERVER (UI Web - puerto 8080)
  # ═════════════════════════════════════════════════════════════════════
  airflow-webserver:
    image: apache/airflow:2.7.0-python3.11
    container_name: faro-airflow-webserver
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    networks:
      - faro-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: webserver

  # ═════════════════════════════════════════════════════════════════════
  # AIRFLOW SCHEDULER (Orquestador de DAGs)
  # ═════════════════════════════════════════════════════════════════════
  airflow-scheduler:
    image: apache/airflow:2.7.0-python3.11
    container_name: faro-airflow-scheduler
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow-logs:/opt/airflow/logs
      - airflow-plugins:/opt/airflow/plugins
    networks:
      - faro-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname $(hostname)"]
      interval: 30s
      timeout: 10s
      retries: 5
    command: scheduler
